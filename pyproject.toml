[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iassis-auth"
version = "0.2.0"
description = "Shared FastAPI authentication library for IASSIS Medical Group internal services."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "IASSIS Medical Group" }]
license = { text = "Proprietary" }
classifiers = [
    "Private :: Do Not Upload",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110,<1.0",
    "PyJWT>=2.10,<3",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.0,<3",
    "httpx>=0.27,<1",
    "starlette>=0.40,<1",
    "itsdangerous>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
    "cryptography>=42",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auth"]

[tool.hatch.build.targets.sdist]
include = [
    "src/auth",
    "README.md",
    "constraints.txt",
    "pyproject.toml",
]